        - paragraph [ref=e165]: Aucun opérateur à installer, aucun CRD, aucun Helm chart. pgpilot parle à l'API Kubernetes avec tes droits existants et crée des objets standards que tu peux lire, éditer ou supprimer à la main.
      - list [ref=e166]:
        - listitem [ref=e167]:
