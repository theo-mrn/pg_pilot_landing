            - generic [ref=e170]: "01"
            - generic [ref=e172]:
              - heading "Détecte tes bases" [level=3] [ref=e173]
              - generic [ref=e174]: $pgpilot detect
            - paragraph [ref=e175]: pgpilot lit ta kubeconfig, scanne le cluster et trouve les Services PostgreSQL joignables. Il écrit un backup.yaml prérempli — pas une ligne de YAML à la main.
        - listitem [ref=e176]:
          - generic [ref=e178]:
            - generic [ref=e179]: "02"
            - generic [ref=e181]:
              - heading "Déploie les CronJobs" [level=3] [ref=e182]
              - generic [ref=e183]: $pgpilot deploy myapp
            - paragraph [ref=e184]: Tu renseignes le schedule, le bucket et la rétention. pgpilot crée un CronJob par base dans le namespace concerné. Rien d'autre ne bouge dans le cluster.
        - listitem [ref=e185]:
          - generic [ref=e187]:
            - generic [ref=e188]: "03"
            - generic [ref=e190]:
              - heading "Vérifie, puis oublie" [level=3] [ref=e191]
              - generic [ref=e192]: $pgpilot backup myapp run --wait
            - paragraph [ref=e193]: Un backup manuel pour confirmer que le dump part bien vers S3. Ensuite le cron prend le relais, et status te dit en une ligne si tout tourne.
